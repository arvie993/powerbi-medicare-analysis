<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F8FBFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F4FC;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle circle pattern -->
    <pattern id="circlePattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="60" cy="60" r="50" fill="none" stroke="#0077B6" stroke-width="0.5" opacity="0.08"/>
      <circle cx="60" cy="60" r="35" fill="none" stroke="#00B4D8" stroke-width="0.3" opacity="0.06"/>
      <circle cx="60" cy="60" r="20" fill="none" stroke="#48CAE4" stroke-width="0.3" opacity="0.05"/>
    </pattern>
    
    <!-- Decorative wave -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0077B6;stop-opacity:0.03" />
      <stop offset="50%" style="stop-color:#00B4D8;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#48CAE4;stop-opacity:0.03" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Circle pattern overlay -->
  <rect width="1920" height="1080" fill="url(#circlePattern)"/>
  
  <!-- Decorative wave at bottom -->
  <path d="M0,950 Q480,900 960,950 T1920,950 L1920,1080 L0,1080 Z" fill="url(#waveGradient)"/>
  
  <!-- Subtle top accent -->
  <path d="M0,0 L1920,0 L1920,80 Q1440,120 960,80 T0,80 Z" fill="#0077B6" opacity="0.02"/>
  
  <!-- Corner accent circles -->
  <circle cx="1850" cy="70" r="200" fill="#0077B6" opacity="0.02"/>
  <circle cx="1880" cy="40" r="150" fill="#00B4D8" opacity="0.02"/>
  <circle cx="70" cy="1010" r="180" fill="#0077B6" opacity="0.02"/>
  <circle cx="40" cy="1040" r="120" fill="#00B4D8" opacity="0.02"/>
</svg>
